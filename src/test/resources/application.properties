spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
debug=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
document-store.database.production-safety-check=false
document-store.reconciliation.enabled=false
document-store.object-storage.provider=filesystem
document-store.object-storage.filesystem-root=${java.io.tmpdir}/document-store-tests/${random.uuid}
document-store.security.jwk-set-uri=http://127.0.0.1:1/.well-known/jwks.json
document-store.security.issuer=job-seeker-copilot-authentication
document-store.security.audience=job-seeker-copilot-services
document-store.security.service-identity.producer-token=test-only-document-producer-token-32-bytes
document-store.security.service-identity.reader-token=test-only-document-reader-token-32-bytes
document-store.security.service-identity.retention-admin-token=test-only-retention-admin-token-32-bytes
document-store.security.environment-data-token=test-only-environment-data-token-32-bytes
document-store.retention.policy-version=test-policy-v1
