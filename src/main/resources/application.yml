server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: document-store-service
  servlet:
    multipart:
      max-file-size: ${DOCUMENT_STORE_MAXIMUM_FILE_BYTES:10485760}
      max-request-size: ${DOCUMENT_STORE_MAXIMUM_REQUEST_BYTES:11534336}
  datasource:
    url: ${DOCUMENT_STORE_DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DOCUMENT_STORE_DATABASE_USERNAME}
    password: ${DOCUMENT_STORE_DATABASE_PASSWORD}
    hikari:
      initialization-fail-timeout: 1
      data-source-properties:
        sslmode: ${DOCUMENT_STORE_DATABASE_SSL_MODE:verify-full}
  flyway:
    enabled: true
    locations: classpath:db/migration/common
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,documentStorage
  endpoints:
    web:
      exposure:
        include: health

document-store:
  validation:
    maximum-file-bytes: ${DOCUMENT_STORE_MAXIMUM_FILE_BYTES:10485760}
    maximum-docx-entries: ${DOCUMENT_STORE_MAXIMUM_DOCX_ENTRIES:256}
    maximum-docx-entry-bytes: ${DOCUMENT_STORE_MAXIMUM_DOCX_ENTRY_BYTES:10485760}
    maximum-docx-expanded-bytes: ${DOCUMENT_STORE_MAXIMUM_DOCX_EXPANDED_BYTES:26214400}
    maximum-docx-expansion-ratio: ${DOCUMENT_STORE_MAXIMUM_DOCX_EXPANSION_RATIO:100}
  object-storage:
    provider: ${DOCUMENT_STORE_OBJECT_PROVIDER:s3}
    filesystem-root: ${DOCUMENT_STORE_FILESYSTEM_ROOT:}
    s3:
      endpoint: ${DOCUMENT_STORE_OBJECT_ENDPOINT:}
      region: ${DOCUMENT_STORE_OBJECT_REGION:}
      bucket: ${DOCUMENT_STORE_OBJECT_BUCKET:}
      access-key: ${DOCUMENT_STORE_OBJECT_ACCESS_KEY:}
      secret-key: ${DOCUMENT_STORE_OBJECT_SECRET_KEY:}
      kms-key-id: ${DOCUMENT_STORE_OBJECT_KMS_KEY_ID:}
      path-style-access: ${DOCUMENT_STORE_OBJECT_PATH_STYLE:false}
  database:
    production-safety-check: true
    encryption-at-rest-enabled: ${DOCUMENT_STORE_ENCRYPTION_AT_REST_ENABLED:false}
    encryption-key-reference: ${DOCUMENT_STORE_ENCRYPTION_KEY_REFERENCE:}
    backup-encryption-enabled: ${DOCUMENT_STORE_BACKUP_ENCRYPTION_ENABLED:false}
    backup-key-reference: ${DOCUMENT_STORE_BACKUP_KEY_REFERENCE:}
  security:
    jwk-set-uri: ${AUTH_JWKS_URI:http://authentication-service:8084/.well-known/jwks.json}
    issuer: ${DOCUMENT_STORE_JWT_ISSUER:job-seeker-copilot-authentication}
    audience: ${DOCUMENT_STORE_JWT_AUDIENCE:job-seeker-copilot-services}
    service-identity:
      producer-token: ${DOCUMENT_STORE_PRODUCER_TOKEN:}
      reader-token: ${DOCUMENT_STORE_READER_TOKEN:}
    environment-data-token: ${ENVIRONMENT_DATA_TOKEN:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
    com.zaxxer.hikari: WARN
    org.flywaydb.core: WARN
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
    org.springframework.jdbc.core: INFO
    org.springframework.web: INFO
    org.springframework.web.servlet.handler.HandlerMappingIntrospector: ERROR
