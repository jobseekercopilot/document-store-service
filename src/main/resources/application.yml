server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: document-store-service
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: jdbc:h2:mem:documentstoredb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health

document-store:
  security:
    jwk-set-uri: ${AUTH_JWKS_URI:http://authentication-service:8084/.well-known/jwks.json}
    issuer: ${DOCUMENT_STORE_JWT_ISSUER:job-seeker-copilot-authentication}
    audience: ${DOCUMENT_STORE_JWT_AUDIENCE:job-seeker-copilot-services}
    service-identity:
      producer-token: ${DOCUMENT_STORE_PRODUCER_TOKEN:}
      reader-token: ${DOCUMENT_STORE_READER_TOKEN:}
    environment-data-token: ${ENVIRONMENT_DATA_TOKEN:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
