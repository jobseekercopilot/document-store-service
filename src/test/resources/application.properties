spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
document-store.security.jwk-set-uri=http://127.0.0.1:1/.well-known/jwks.json
document-store.security.issuer=job-seeker-copilot-authentication
document-store.security.audience=job-seeker-copilot-services
document-store.security.service-identity.producer-token=test-only-document-producer-token-32-bytes
document-store.security.service-identity.reader-token=test-only-document-reader-token-32-bytes
document-store.security.environment-data-token=test-only-environment-data-token-32-bytes
